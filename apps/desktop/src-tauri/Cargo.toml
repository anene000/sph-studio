[package]
name = "sph-studio"
version = "0.0.1"
description = "SPH Studio desktop shell"
authors = ["anene000"]
edition = "2021"

[lib]
name = "sph_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Phase B / U19: the shell plugin is used to launch the Python (FastAPI) sidecar.
# tauri-plugin-shell = "2"
