name: Release (desktop)

# U20: build the Tauri desktop app with the bundled Python (PyInstaller) sidecar for
# each OS and attach installers to a GitHub Release. Tag-triggered only so it never
# runs on normal pushes (keeping the fast ci.yml green and avoiding heavy CI minutes).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable

      - name: Linux WebView deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Install Python deps
        run: pip install -r backend/requirements.txt -r solver/requirements.txt pyinstaller

      - name: Build backend sidecar (PyInstaller) — unix
        if: matrix.os != 'windows-latest'
        run: bash scripts/build_sidecar.sh

      - name: Build backend sidecar (PyInstaller) — windows
        if: matrix.os == 'windows-latest'
        run: pwsh scripts/build_sidecar.ps1

      - name: Enable sidecar bundling (externalBin)
        shell: python
        run: |
          import json, pathlib
          p = pathlib.Path("apps/desktop/src-tauri/tauri.conf.json")
          c = json.loads(p.read_text(encoding="utf-8"))
          c["bundle"]["externalBin"] = ["binaries/sph-backend"]
          p.write_text(json.dumps(c, indent=2), encoding="utf-8")

      # apps/desktop is not a pnpm workspace member, so install its @tauri-apps/cli
      # standalone (mirrors the local build) — otherwise `tauri` isn't on PATH.
      - name: Install desktop CLI (@tauri-apps/cli)
        run: npm install --prefix apps/desktop

      - name: Build desktop app (tauri build)
        run: npm --prefix apps/desktop run tauri build

      - name: Upload installers to draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          name: "SPH Studio ${{ github.ref_name }}"
          # Only the finished installers per OS — NOT the AppImage/deb internals that a
          # broad bundle/** glob would sweep up. Unmatched patterns are skipped.
          fail_on_unmatched_files: false
          files: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
