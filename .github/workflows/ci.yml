name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps (pinned)
        run: pip install -r backend/requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check backend solver
      - name: Run backend tests (schema/samples; e2e auto-skips without Taichi)
        run: pytest backend -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile=false
      - name: Typecheck
        run: pnpm --filter web typecheck
      - name: Lint (eslint)
        run: pnpm --filter web lint
      - name: Build
        run: pnpm --filter web build
